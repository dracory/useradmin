<div id="app-user-update" class="mt-3">
<template id="app-user-update-template">
    <div v-if="loading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div v-else>
        <div v-if="errorMessage" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
        </div>

        <div v-if="warningFields.length > 0" class="alert alert-warning">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            The following field tokens could not be decrypted: {{ warningFields.join(', ') }}.
            This may be due to a vault key mismatch. These fields show encrypted data and are disabled until the tokens can be read.
        </div>

        <div class="card">
            <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" @click="statusCollapsed = !statusCollapsed">
                <h4 style="margin-bottom:0;"><i class="bi me-2" :class="statusCollapsed ? 'bi-plus-circle' : 'bi-dash-circle'"></i>Status</h4>
                <button type="button" class="btn btn-success btn-sm" @click.stop="saveSection('status')" :disabled="hasUnreadableFields || savingSection === 'status'" v-show="!statusCollapsed">
                    <span v-if="savingSection === 'status'" class="spinner-border spinner-border-sm me-1"></span>
                    <i v-else class="bi bi-check2 me-1"></i>Save
                </button>
            </div>
            <div class="card-body" v-show="!statusCollapsed">
                <div class="mb-0">
                    <label class="form-label">Status</label>
                    <select v-model="form.status" class="form-select" :disabled="hasUnreadableFields">
                        <option value="">- not selected -</option>
                        <option value="active">Active</option>
                        <option value="unverified">Unverified</option>
                        <option value="inactive">Inactive</option>
                        <option value="deleted">In Trash Bin</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" @click="detailsCollapsed = !detailsCollapsed">
                <h4 style="margin-bottom:0;"><i class="bi me-2" :class="detailsCollapsed ? 'bi-plus-circle' : 'bi-dash-circle'"></i>User Details</h4>
                <button type="button" class="btn btn-success btn-sm" @click.stop="saveSection('details')" :disabled="hasUnreadableFields || savingSection === 'details'" v-show="!detailsCollapsed">
                    <span v-if="savingSection === 'details'" class="spinner-border spinner-border-sm me-1"></span>
                    <i v-else class="bi bi-check2 me-1"></i>Save
                </button>
            </div>
            <div class="card-body" v-show="!detailsCollapsed">
                <form @submit.prevent="saveSection('details')">
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input v-model="form.first_name" type="text" class="form-control" :disabled="!fieldStatus.first_name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input v-model="form.last_name" type="text" class="form-control" :disabled="!fieldStatus.last_name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input v-model="form.email" type="email" class="form-control" :disabled="!fieldStatus.email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Business Name</label>
                        <input v-model="form.business_name" type="text" class="form-control" :disabled="!fieldStatus.business_name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input v-model="form.phone" type="text" class="form-control" :disabled="!fieldStatus.phone">
                    </div>
                </form>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" @click="rolesCollapsed = !rolesCollapsed">
                <h4 style="margin-bottom:0;"><i class="bi me-2" :class="rolesCollapsed ? 'bi-plus-circle' : 'bi-dash-circle'"></i>Roles</h4>
                <button type="button" class="btn btn-success btn-sm" @click.stop="saveSection('roles')" :disabled="hasUnreadableFields || savingSection === 'roles'" v-show="!rolesCollapsed">
                    <span v-if="savingSection === 'roles'" class="spinner-border spinner-border-sm me-1"></span>
                    <i v-else class="bi bi-check2 me-1"></i>Save
                </button>
            </div>
            <div class="card-body" v-show="!rolesCollapsed">
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <div class="form-text text-warning mb-1">Deprecated, will be removed Jan 2028</div>
                    <select v-model="form.role" class="form-select" :disabled="hasUnreadableFields">
                        <option value="">- not selected -</option>
                        <option value="user">User</option>
                        <option value="administrator">Administrator</option>
                    </select>
                </div>

                <div class="mb-3" v-if="roles.length > 0">
                    <label class="form-label">Roles</label>
                    <div class="form-check" v-for="r in roles" :key="r.id">
                        <input class="form-check-input" type="checkbox" :id="'role-' + r.id" :value="r.id" v-model="form.role_ids" :disabled="hasUnreadableFields">
                        <label class="form-check-label" :for="'role-' + r.id">{{ r.name }} <span class="text-muted small">({{ r.handle }})</span></label>
                    </div>
                </div>

                <div class="mb-0" v-if="groups.length > 0">
                    <label class="form-label">Groups</label>
                    <div class="form-check" v-for="g in groups" :key="g.id">
                        <input class="form-check-input" type="checkbox" :id="'group-' + g.id" :value="g.id" v-model="form.group_ids" :disabled="hasUnreadableFields">
                        <label class="form-check-label" :for="'group-' + g.id">{{ g.name }} <span class="text-muted small">({{ g.handle }})</span></label>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" @click="locationCollapsed = !locationCollapsed">
                <h4 style="margin-bottom:0;"><i class="bi me-2" :class="locationCollapsed ? 'bi-plus-circle' : 'bi-dash-circle'"></i>Location</h4>
                <button type="button" class="btn btn-success btn-sm" @click.stop="saveSection('location')" :disabled="hasUnreadableFields || savingSection === 'location'" v-show="!locationCollapsed">
                    <span v-if="savingSection === 'location'" class="spinner-border spinner-border-sm me-1"></span>
                    <i v-else class="bi bi-check2 me-1"></i>Save
                </button>
            </div>
            <div class="card-body" v-show="!locationCollapsed">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Country</label>
                        <select v-model="form.country" class="form-select" @change="onCountryChange" :disabled="hasUnreadableFields">
                            <option value="">Select country</option>
                            <option v-for="c in countries" :key="c.iso_code_2" :value="c.iso_code_2">{{ c.name }}</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Timezone</label>
                        <select v-model="form.timezone" class="form-select" :disabled="hasUnreadableFields || timezones.length === 0">
                            <option value="">Select timezone</option>
                            <option v-for="tz in timezones" :key="tz.timezone" :value="tz.timezone">{{ tz.timezone }}</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" @click="passwordCollapsed = !passwordCollapsed">
                <h4 style="margin-bottom:0;"><i class="bi me-2" :class="passwordCollapsed ? 'bi-plus-circle' : 'bi-dash-circle'"></i>Change Password</h4>
                <button type="button" class="btn btn-success btn-sm" @click.stop="changePassword" :disabled="passwordSaving" v-show="!passwordCollapsed">
                    <span v-if="passwordSaving" class="spinner-border spinner-border-sm me-1"></span>
                    <i v-else class="bi bi-key me-1"></i>Save
                </button>
            </div>
            <div class="card-body" v-show="!passwordCollapsed">
                <div class="form-text mb-3">Set a new password for this user. The user will need to use it on their next login.</div>
                <form @submit.prevent="changePassword">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">New Password</label>
                            <div class="input-group">
                                <input v-model="passwordForm.password" :type="showPassword ? 'text' : 'password'" class="form-control" autocomplete="new-password" aria-label="New password">
                                <button class="btn btn-outline-secondary" type="button" @click="showPassword = !showPassword" :title="showPassword ? 'Hide password' : 'Show password'" :aria-label="showPassword ? 'Hide password' : 'Show password'">
                                    <i class="bi" :class="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <input v-model="passwordForm.password_confirm" :type="showPasswordConfirm ? 'text' : 'password'" class="form-control" autocomplete="new-password" aria-label="Confirm password">
                                <button class="btn btn-outline-secondary" type="button" @click="showPasswordConfirm = !showPasswordConfirm" :title="showPasswordConfirm ? 'Hide password' : 'Show password'" :aria-label="showPasswordConfirm ? 'Hide password' : 'Show password'">
                                    <i class="bi" :class="showPasswordConfirm ? 'bi-eye-slash' : 'bi-eye'"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" @click="notesCollapsed = !notesCollapsed">
                <h4 style="margin-bottom:0;"><i class="bi me-2" :class="notesCollapsed ? 'bi-plus-circle' : 'bi-dash-circle'"></i>Admin Notes</h4>
                <button type="button" class="btn btn-success btn-sm" @click.stop="saveSection('notes')" :disabled="hasUnreadableFields || savingSection === 'notes'" v-show="!notesCollapsed">
                    <span v-if="savingSection === 'notes'" class="spinner-border spinner-border-sm me-1"></span>
                    <i v-else class="bi bi-check2 me-1"></i>Save
                </button>
            </div>
            <div class="card-body" v-show="!notesCollapsed">
                <div class="form-text mb-3">Internal notes about this user. Only visible to administrators.</div>
                <textarea v-model="form.memo" class="form-control" rows="4" :disabled="hasUnreadableFields"></textarea>
            </div>
        </div>

        <div class="mt-4">
            <a :href="returnUrl" class="btn btn-secondary">
                <i class="bi bi-chevron-left me-2"></i>Back
            </a>
        </div>
    </div>
</template>
</div>
