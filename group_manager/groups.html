<div id="groups-app">
  <div v-if="loading" class="text-center py-5">
    <div class="spinner-border text-primary" group="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div v-else>
    <div class="card bg-body-tertiary mb-3">
      <div class="card-body d-flex align-items-center justify-content-between">
        <span class="text-body">{{ groups.length }} group(s)</span>
        <button class="btn btn-primary btn-sm" @click="showCreateModal = true">
          <i class="bi bi-plus-circle me-1"></i> New Group
        </button>
      </div>
    </div>

    <div v-if="groups.length === 0" class="text-center py-4 text-muted border rounded">
      No groups found.
    </div>

    <div v-else class="table-responsive">
      <table class="table table-striped table-hover table-bordered align-middle">
        <thead>
          <tr>
            <th>Name</th>
            <th>Handle</th>
            <th style="width: 120px;">Status</th>
            <th style="width: 1px; white-space: nowrap;">Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="group in groups" :key="group.id">
            <td>
              <a :href="urlGroupView.replace('GROUP_ID_PLACEHOLDER', group.id)" class="text-decoration-none">
                {{ group.name }}
              </a>
              <div class="small text-muted">Ref: {{ group.id }}</div>
            </td>
            <td class="small">{{ group.handle }}</td>
            <td>
              <span class="badge" :class="statusClass(group.status)">{{ group.status }}</span>
            </td>
            <td class="small" style="white-space: nowrap;">{{ group.created_at }}</td>
            <td>
              <a :href="urlGroupUpdate.replace('GROUP_ID_PLACEHOLDER', group.id)" class="btn btn-sm btn-primary me-1" title="Edit">
                <i class="bi bi-pencil-square"></i>
              </a>
              <button class="btn btn-sm btn-danger" @click="deleteGroup(group)" title="Delete">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Create Group Modal -->
    <div v-if="showCreateModal" class="modal-backdrop fade show" style="display: block; z-index: 1040;"></div>
    <div v-if="showCreateModal" class="modal fade show" style="display: block; z-index: 1050;">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Create New Group</h5>
            <button type="button" class="btn-close" @click="showCreateModal = false"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input v-model="newGroup.name" type="text" class="form-control" placeholder="Group name">
            </div>
            <div class="mb-3">
              <label class="form-label">Handle</label>
              <input v-model="newGroup.handle" type="text" class="form-control" placeholder="group-handle">
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" @click="showCreateModal = false">Cancel</button>
            <button class="btn btn-primary" @click="createGroup" :disabled="creating">
              <span v-if="creating" class="spinner-border spinner-border-sm me-1"></span>
              Create
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
