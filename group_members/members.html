<div id="app-group-members" class="mt-3">
<template id="app-group-members-template">
    <div v-if="loading" class="text-center py-4">
        <div class="spinner-border text-primary" group="status"></div>
    </div>

    <div v-else>
        <div class="mb-3">
            <button class="btn btn-primary" type="button" @click="openAddModal">
                <i class="bi bi-person-plus me-1"></i>Add Member
            </button>
        </div>

        <div v-if="members.length === 0" class="text-muted border rounded py-3 text-center">
            No users have this group.
        </div>

        <div v-else class="table-responsive">
            <table class="table table-striped table-hover table-bordered align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th style="width: 1px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="member in members" :key="member.user_id">
                        <td>
                            {{ member.name }}
                            <div class="small text-muted">Ref: {{ member.user_id }}</div>
                        </td>
                        <td class="small">{{ member.email }}</td>
                        <td><span class="badge" :class="statusClass(member.status)">{{ member.status }}</span></td>
                        <td>
                            <button class="btn btn-sm btn-danger" @click="removeMember(member)" title="Remove">
                                <i class="bi bi-person-dash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4">
            <a :href="returnUrl" class="btn btn-secondary">
                <i class="bi bi-chevron-left me-2"></i>Back to Group
            </a>
        </div>
    </div>

    <!-- Add Member Modal -->
    <div v-if="showAddModal" class="modal-backdrop fade show" style="display: block; z-index: 1040;"></div>
    <div v-if="showAddModal" class="modal fade show" style="display: block; z-index: 1050;">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Member</h5>
                    <button type="button" class="btn-close" @click="closeAddModal"></button>
                </div>
                <div class="modal-body">
                    <input
                        v-model="searchQuery"
                        @input="onSearchInput"
                        type="text"
                        class="form-control mb-3"
                        placeholder="Type to search by name or email..."
                        ref="searchInput">

                    <div v-if="searching" class="text-center py-3">
                        <div class="spinner-border spinner-border-sm text-primary" group="status"></div>
                    </div>

                    <div v-else-if="searchResults.length === 0" class="text-muted text-center py-3">
                        No users found.
                    </div>

                    <div v-else class="list-group" style="max-height: 400px; overflow-y: auto;">
                        <div v-for="user in searchResults" :key="user.user_id"
                             class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <div>{{ user.name || user.user_id }}</div>
                                <div class="small text-muted">{{ user.email }}</div>
                            </div>
                            <button v-if="isMember(user.user_id)" class="btn btn-sm btn-outline-secondary" disabled>
                                Member
                            </button>
                            <button v-else class="btn btn-sm btn-primary" @click="addMember(user)" :disabled="addingMember">
                                <i class="bi bi-plus-lg"></i> Add
                            </button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="closeAddModal">Close</button>
                </div>
            </div>
        </div>
    </div>
</template>
</div>
